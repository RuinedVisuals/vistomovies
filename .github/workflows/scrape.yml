name: Scrape showtimes
on:
  schedule:
    # Daily: new week appears Thursday (retries cover late updates), other days pick up mid-week edits
    - cron: '0 6 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scrape:
    runs-on: ubuntu-latest
    env:
      TMDB_READ_TOKEN: ${{ secrets.TMDB_READ_TOKEN }}  # update fetches TMDB metadata too, not only export
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -r requirements.txt
      - name: Restore history (data/ is gitignored) so new films are flagged
        run: mkdir -p data && cp frontend/public/history.json data/history.json
      - run: python -m showtimes update
      - run: python -m showtimes export-static
      - name: Commit if changed
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add frontend/public
          git diff --cached --quiet || (git commit -m "Auto-refresh showtimes" && git push)
